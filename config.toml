[speech_det]
model_path= "res/faster-whisper-medium"
silence_timeout_s = 2.0
language = "en"

[brain] # llm configuration
# model = "google/gemma-4-e4b"
model = "qwen/qwen3.5-0.8b"
# model = "qwen/qwen3.5-4b"
# model = "qwen/qwen3-vl-4b"
# model = "qwen/qwen3.5-9b"
# model = "liquid/lfm2.5-1.2b"
# model = "zai-org/glm-4.6v-flash"
system_prompt = "You are a helpful assistant, answer the user's questions concisely and accurately, if you don't know the answer, say 'I don't know."
history_path = "chat_history.log"
context_ratio = 1.0
temperature = 0.6

[agent]
bootstrap_prompt = "Recall past chat and say 'Hello' to the user. Store the chat if personal data are provided"

[speech_gen]
model_path = "res/voices/en_US-hfc_female-medium.onnx"
samplerate = 22050
