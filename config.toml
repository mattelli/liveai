[audio_input]
model_path= "res/faster-whisper-medium"
record_seconds = 6

[lm_studio] # Language model settings
url = "http://localhost:1234/v1"
model = "qwen3.5-0.8b"
api_key = "lm-studio"
temperature = 0.7
system_prompt = "You are a helpful assistant. Answer the user's question concisely and accurately."

[audio_output]
model_path = "res/voices/en_US-hfc_female-medium.onnx"
samplerate = 16000
channels = 1
datatype = "int16"
