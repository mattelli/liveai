[logging]
level = "WARNING"

[cwd] # runtime data root: paths ending in "_cwd" are resolved relative to the directory main.py is launched from (not the config file)
data_dir_cwd = ".liveai"             # data root; holds memory.log, sessions/, agents.jsonl, input.log, schedule.json, tmp/, behaviour/
tmp_dir_cwd = "tmp"                  # scratch folder (under data_dir_cwd) for files the agent writes when no explicit path is given
behaviour_dir_cwd = "behaviour"      # markdown instruction files (under data_dir_cwd) for the agent (discovered via the bootstrap prompt)

[brain] # LLM configuration: the model connection (model, base_url, api_key_env) lives in the models JSON file ([brain] models_file); 

# Legacy, models-file-less setup (used only when models_file is unset):
# base_url = "https://openrouter.ai/api/v1"
# api_key_env = "OPENROUTER_API_KEY"
# model = "z-ai/glm-5.3-flash"

system_prompt = "You are a helpful assistant, answer the user's questions concisely and accurately, if you don't know the answer, say 'I don't know.'"
memory_path_cwd = "memory.log"     # personal memory (under [cwd] data_dir_cwd)
sessions_dir_cwd = "sessions"      # folder for /session store|list|load chat session files (JSON; under data_dir_cwd)
models_file = "models.json"        # models: first entry boots, /model switches (JSON: name -> {api_key_env, base_url, model})
max_response_tokens = 0.1          # cap tokens per response as a ratio of the model's context window (0 < ratio < 1)
temperature = 0.6                  # randomness (0 = deterministic, 1 = random)
request_timeout_s = 600            # max seconds between stream chunks before the request is aborted (backstop against a hung server; 0 = SDK default)
max_tool_result_chars = 4000       # cap tool results stored in the history, head+tail kept (0 = uncapped; also caps the compaction summary and the re-seeded recall text)
context_trim_ratio = 0.7           # prune oldest complete tool rounds when context usage exceeds this ratio (0 = never prune)
context_keep_messages = 40         # recent messages never pruned (used when context_trim_ratio > 0)
auto_compaction = false            # run compact_chat (summary) instead of plain pruning when context_trim_ratio is exceeded (false = legacy pruning only; group-aligned split, head excluded, idempotent, never grows the history)
# compact_keep_messages = 4        # recent turns kept by auto-compaction (default: context_keep_messages)
# Vision support and the context window are auto-detected from the model metadata reported by the server (OpenAI /models endpoint, e.g. LMStudio max_context_length). 
# Only set the optional overrides below for servers that do not report them:
# vision = true
# context_window = 8192

[agent] # agent configuration
bootstrap_prompt = "Read AGENT.md in the CWD or in {behaviour_dir} and follow its instructions. If no AGENT.md is found, proceed by announcing 'No agent instructions found.'"
max_act_rounds = 100       # max tool-loop rounds per agent turn (default 100)
tool_doc_chars = 200       # cap tool descriptions in the JSON schemas sent with every request (0 = full docstrings)
# tool_groups = "model, memory, files, web, system"  # keep only these tool topics (default "all")
monitor = "log"                                  # scheduled-task monitoring flags: "calls" (labeled [CALL] blocks), "log" (JSONL event log), comma-separated; empty = quiet
monitor_log_file_cwd = "agents.jsonl"            # JSONL event log path (monitor = "log"; under data_dir_cwd)
monitor_buffer = 100                             # in-memory events kept for the agent_activity tool

[delegation] # background/delegated work: scheduler, notifications, sub-agents (all keys optional)

[delegation.scheduler] # schedule agent prompts for a future time (all keys optional)
enabled = true                       # false (or missing section) -> tools are no-ops
persist_file_cwd = "schedule.json"   # task persistence (survives restarts; under data_dir_cwd)
on_missed = "skip"                   # one-shot tasks missed while the app was off: "run" -> execute immediately, "skip" -> drop
agent = ""                           # run scheduled prompts on this [delegation.agents.<name>] entry (unset/empty = the main agent's model and tool groups)

[delegation.notify] # terminal hint when a background task completes (all keys optional)
terminal = true  # print "🔔 task completed" when a scheduled task or sub-agent finishes (missing section = off)

[delegation.agents] # sub-agents the main agent can delegate to with delegate_task (all keys optional)
# One [delegation.agents.<name>] table per sub-agent; no entries -> no delegate_task tool.
# Children run asynchronously (fire-and-forget): delegate_task returns an
# acknowledgment immediately, the result arrives when the child finishes
# (injected into the chat history on the next turn). Flat topology: children
# cannot delegate. Each child gets its own tool instances (memory/vision).
summarize_results = false            # true -> long child results are condensed by an LLM summary before being shown
# summarize_max_chars = 800          # results longer than this get summarized (0 = summarize everything)
[delegation.agents.researcher]
tool_groups = "web, files"         # tool topics for this child (see [agent] tool_groups)
model = "ternary-bonsai"           # models.json entry name; unset = the main model
system_prompt = "You are a research assistant. Be concise and cite sources."
max_act_rounds = 50                # child round budget (default: Agent class default)
description = "web research"       # shown to the main agent in its prompt

[ui] # chat appearance (all keys optional)
prompt = "You (hint '/') ›"      # chat-mode input label
prompt_color = "yellow"     # label color: black/red/green/yellow/blue/magenta/cyan/grey/white (prompt_toolkit path only)
assistant_color = "cyan"    # streamed assistant text color (any rich style: bright_blue, #5fd7ff, ...)
code_theme = "monokai"      # Pygments theme for fenced code blocks (ansi_dark, dracula, github-dark, ...)
markdown = true             # true -> render the final response as Markdown (headings, lists, tables, links, inline code) instead of streaming raw text; disables token-by-token streaming
banner = true               # false -> single-line "Agent ready." startup banner
banner_logo = true          # false -> hide the ASCII-art logo inside the banner panel
call_lines_max = 0          # max lines of the [CALL] tool-call block; extra params elided; 0 = skip the dump entirely
line_width = 120            # max width of each parameter value line; max limit is 240
show_thinking = false        # Chain-of-thought visualization, reasoning is display-only it never enters the chat history or the spoken/returned answer.
max_thinking_tokens = 100   # max tokens of thinking to visualize (0 = unlimited)

[input] # Interactive chat input (prompt_toolkit). All keys optional.
history_file_cwd = "input.log"   # prompt_toolkit history (under data_dir_cwd); "." or empty disables persistence
prompt_toolkit = true            # false -> builtin input() fallback
auto_suggest = true              # inline history suggestions
completion = true                # complete /slash commands with Tab
explicit_paste = true            # /paste ... . fallback for terminals without bracketed paste
multiline = false                # true -> Esc+Enter to accept (advanced)

[speech_det] # speech detection and transcription (faster-whisper)
model_path= ".res/faster-whisper-medium"
silence_timeout_s = 2.0
language = "en" # ISO 639-1 code, e.g. "en", "fr", "de", "it", "es", "zh", etc.
beam_size = 5
show_levels = true
device = "auto"
compute_type = "int8"
calibration_chunks = 20
guard_factor = 1.0

[speech_gen] # speech synthesis (TTS)
model_path = ".res/voices/en_US-hfc_female-medium.onnx"
# model_path = ".res/voices/it_IT-serena-high.onnx"
samplerate = 22050
volume = 1.0
speech_speed = 1.0
# speaker_id = 0          # Optional synthesis knobs (single-speaker voices can leave speaker_id commented out)
noise_scale = 1.0
noise_w_scale = 1.0
normalize_audio = false
pause_comma_ms = 150        # pause after , ; : — (scaled by speech_speed)
pause_sentence_ms = 350     # pause after . ! ? …
pause_paragraph_ms = 600    # pause at paragraph / blank-line boundaries
non_prose_content = false   # true = also read code blocks / tables aloud
omitted_placeholder = "content omitted"  # spoken instead of code blocks / tables when non_prose_content = false ("" = silent)

[summarization] # extractive text summarization (LexRank + sentence embeddings)
model_path = ".res/embedding/all-MiniLM-L6-v2"  # resolved relative to this config file
device = "cpu"            # "cpu" or "cuda"
ratio = 0.1               # fraction of sentences to keep (0 < ratio <= 1)
threshold = 0.5           # LexRank similarity threshold in [0, 1)
max_sentences = 0         # 0 -> derive from ratio; >0 -> hard cap

[document_query] # in-document search with a CrossEncoder
model_path = ".res/crossencoder/ms-marco-TinyBERT-L2"  # resolved relative to this config file
device = "cpu"            # "cpu" or "cuda"
chunk_size = 3            # consecutive sentences per passage
top_k = 5                 # default number of results returned by query_document

[image_search] # search images in a folder with a CLIP model
model_path = ".res/embedding/clip-ViT-B-32"  # same CLIP model as the multimodal embedding mode
device = "cpu"            # "cpu" or "cuda"
top_k = 3                 # default number of results returned by image_search

[image_gen] # local image generation with Stable Diffusion
t2i_model = "UnfilteredAI/NSFW-GEN-ANIME"     # text-to-image model (HuggingFace id or local path)
i2i_model = "runwayml/stable-diffusion-v1-5"  # image-to-image / inpaint model
device = "auto"         # "auto" (cuda when available), "cpu" or "cuda"
negative_prompt = ""    # default img2img/inpaint negative prompt (empty = none)
width = 512             # default image width in pixels (multiple of 8)
height = 512            # default image height in pixels (multiple of 8)
steps = 50              # default diffusion steps (higher = slower, more refined)
seed = -1               # default seed; negative -> random seed for every image
guidance = 5.0          # default img2img/inpaint prompt guidance (3-12)
denoise = 0.5           # default img2img/inpaint denoise strength (0-1)
out_dir = ".out_images" # folder for generated images (resolved relative to this file)

[embedding] # semantic search over one or more named local corpora
model_path = ".res/embedding/all-MiniLM-L6-v2"     # text-only-mode encoder
image_model_path = ".res/embedding/clip-ViT-B-32"  # shared text+image encoder (multimodal)
multimodal = true          # true -> use image_model_path for BOTH text and images
device = "cpu"             # "cpu" or "cuda"
corpora_dir = ".res/corpora"  # resolved relative to this config file
extensions = "txt, md, markdown, tex, rst, log, csv, html, htm, pdf, docx, xlsx, png, jpg, jpeg, webp, bmp, tiff"
image_extensions = "png, jpg, jpeg, webp, bmp, tiff"
chunk_size = 5             # sentences per indexed passage
top_k = 5                  # default number of results returned by query_corpus

[mcp] # MCP (Model Context Protocol) servers as agent tools (optional; pip install mcp)
# Servers live in the JSON file below (not here); see the README "MCP servers"
# section for the file shape, auth keys and examples. /mcp inspects, /mcp refresh
# re-reads the file. A missing or malformed file is ignored silently.
mcp_enabled = true             # false -> MCP off: no servers, no MCP tools at all
servers_file_cwd = "mcp.json"  # MCP server definitions (under [cwd] data_dir_cwd)
connect_timeout_s = 15.0  # per-server connect + tools/list budget
call_timeout_s    = 20.0  # per-tool-call budget
