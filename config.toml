[speech_det]
model_path= ".res/faster-whisper-medium"
silence_timeout_s = 2.0
language = "en"

[brain] # llm configuration
# model = "qwen/qwen3.5-0.8b"  # OK for quick simple test
# model = "mistralai/ministral-3-3b"  # OK
model = "qwen/qwen3-vl-4b"  # OK
# model = "qwen/qwen3-vl-8b"  #  OK but too heavy on this machine
# model = "qwen/qwen3.5-4b"  # too verbose
system_prompt = "You are a helpful assistant, answer the user's questions concisely and accurately, if you don't know the answer, say 'I don't know."
history_path = "chat_history.log"
context_ratio = 1.0
temperature = 0.6

[agent]
bootstrap_prompt = "Recall past chat and say 'Hello' to the user. Ask user name if it is unknown."

[speech_gen]
model_path = ".res/voices/en_US-hfc_female-medium.onnx"
samplerate = 22050
