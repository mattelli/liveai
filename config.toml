[speech_det]
model_path= "res/faster-whisper-medium"
record_seconds = 30.0
silence_threshold = 0.7
silence_timeout = 1.5

[brain] # OpenAI API configuration
# url = "https://api.minimax.io/v1"
# model = "MiniMax-M2.5"
# api_key = "your_api_key_here"

url = "http://localhost:1234/v1"
model = "llama-3.2-1b-instruct"
api_key = "localhost"

temperature = 0.7
system_prompt = "You are a helpful assistant. Answer the user's question concisely and accurately. If you don't know the answer, say 'I don't know.'"

[speech_gen]
model_path = "res/voices/en_US-hfc_female-medium.onnx"
samplerate = 16000
channels = 1
datatype = "int16"
