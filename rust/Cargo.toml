[workspace]
resolver = "2"
members = [
    "crates/la-proto",
    "crates/la-audio",
    "crates/la-core",
    "crates/la-ml",
    "bin/la",
    "bin/la-listen",
    "bin/la-speak",
    "bin/la-imggen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs", "signal", "net"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
ndarray = "0.16"

[profile.release]
opt-level = 3
