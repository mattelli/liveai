[package]
name = "la-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
async-openai = { version = "0.42.1", features = ["chat-completion", "model"] }
aurora_websearch = "0.1.0"
bincode = "1.3.3"
bzip2-rs = "0.1.2"
calamine = "0.36.1"
chrono.workspace = true
crossterm = "0.29.0"
dotenvy = "0.15.7"
flate2 = "1.1.10"
futures.workspace = true
html2text = "0.17.1"
image = { version = "0.25.10", features = ["png", "jpeg", "bmp", "webp", "tiff", "gif"] }
la-audio = { version = "0.1.0", path = "../la-audio" }
la-proto = { version = "0.1.0", path = "../la-proto" }
log.workspace = true
lzma-rs = "0.3.0"
md-5 = "0.11.0"
ndarray.workspace = true
nokhwa = { version = "0.10.11", features = ["input-native"], optional = true }
pdfium-render = "0.9.4"
plotters = { version = "0.3.7", features = ["bitmap_backend", "bitmap_encoder", "line_series", "ttf"] }
quick-xml = "0.42.0"
regex.workspace = true
reqwest = { version = "0.13.5", features = ["json", "stream", "gzip"] }
rustyline = { version = "18.0.1", features = ["with-file-history"] }
serde.workspace = true
serde_json.workspace = true
sevenz-rust2 = "0.23.0"
syntect = "5.3.0"
tar = "0.4.46"
thiserror.workspace = true
tokio.workspace = true
toml = "1.1.6"
walkdir = "2.5.0"
yahoo_finance_api = "5.0.0"
zip = { version = "8.6.0", features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = []
camera = ["dep:nokhwa"]
