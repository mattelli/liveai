[package]
name = "la-ml"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "candle-based encoders for the Live Assistant (MiniLM / CLIP / TinyBERT cross-encoder)"

[dependencies]
anyhow.workspace = true
la-core = { version = "0.1.0", path = "../la-core" }
ndarray.workspace = true
candle-core = { version = "0.11.0", optional = true }
candle-nn = { version = "0.11.0", optional = true }
candle-transformers = { version = "0.11.0", optional = true }
tokenizers = { version = "0.23.2", optional = true }
serde_json.workspace = true
image = { version = "0.25.10", features = ["png", "jpeg", "bmp", "webp", "tiff"] }

[features]
default = []
embeddings = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
clip = ["embeddings"]
cross-encoder = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
